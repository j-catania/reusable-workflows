name: Reusable Dependency Update

on:
  workflow_call:
    inputs:
      assignee:
        description: "Nom d'utilisateur GitHub assigné à la PR"
        required: false
        type: string
        default: 'j-catania'
      target_branch:
        description: 'Branche temporaire créée pour la PR'
        required: false
        type: string
        default: 'automated/dependency-updates'
      node_version:
        description: 'Version de Node.js à utiliser'
        required: false
        type: string
        default: 'lts/*'
      pr_title:
        description: 'Titre de la Pull Request'
        required: false
        type: string
        default: 'chore(deps): automated dependencies update'
    secrets:
      workflow_token:
        description: 'Jeton GitHub optionnel si un PAT avec droits spécifiques est requis'
        required: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect package manager
        id: pkg_detect
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun fichier lock reconnu (pnpm-lock.yaml ou package-lock.json)." >&2
            exit 1
          fi

      - name: Install pnpm
        if: steps.pkg_detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pkg_detect.outputs.manager }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Initial checks (build, test, lint)
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run --if-present build
            pnpm run --if-present test
            pnpm run --if-present lint
          else
            npm run build --if-present
            npm run test --if-present
            npm run lint --if-present
          fi

      - name: Snapshot dependencies before update
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const deps = { ...pkg.dependencies, ...pkg.devDependencies, ...pkg.optionalDependencies };
            const snapshot = {};
            for (const name of Object.keys(deps)) {
              try {
                snapshot[name] = JSON.parse(fs.readFileSync('node_modules/' + name + '/package.json', 'utf8')).version;
              } catch (e) {}
            }
            fs.writeFileSync('/tmp/deps-before.json', JSON.stringify(snapshot));
          "

      - name: Update dependencies
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm update
          else
            npm update
          fi

      - name: Post-update checks (build, test, lint)
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run --if-present build
            pnpm run --if-present test
            pnpm run --if-present lint
          else
            npm run build --if-present
            npm run test --if-present
            npm run lint --if-present
          fi

      - name: Generate PR description
        run: |
          node -e "
            const fs = require('fs');
            const manager = '${{ steps.pkg_detect.outputs.manager }}';
            let before = {};
            try { before = JSON.parse(fs.readFileSync('/tmp/deps-before.json', 'utf8')); } catch (e) {}

            let after = {};
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const deps = { ...pkg.dependencies, ...pkg.devDependencies, ...pkg.optionalDependencies };
              for (const name of Object.keys(deps)) {
                try {
                  after[name] = JSON.parse(fs.readFileSync('node_modules/' + name + '/package.json', 'utf8')).version;
                } catch (e) {}
              }
            } catch (e) {}

            const updated = [];
            for (const [name, newVer] of Object.entries(after)) {
              const oldVer = before[name];
              if (oldVer && newVer && oldVer !== newVer) {
                updated.push('| \`' + name + '\` | \`' + oldVer + '\` | \`' + newVer + '\` |');
              }
            }

            let body = '### 🤖 Mise à jour automatique des dépendances\n\n';
            body += '- **Gestionnaire :** \`' + manager + '\`\n';
            body += '- **Contrôles validés :** \`build\`, \`test\`, \`lint\` (--if-present)\n\n';

            if (updated.length > 0) {
              body += '### 📦 Paquets mis à jour\n\n';
              body += '| Paquet | Version précédente | Nouvelle version |\n';
              body += '| :--- | :--- | :--- |\n';
              body += updated.join('\n') + '\n';
            } else {
              body += '_Mise à jour des dépendances transitives uniquement (lockfile)._\n';
            }

            fs.writeFileSync('pr-description.md', body);
          "

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.workflow_token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies and lockfile"
          branch: ${{ inputs.target_branch }}
          delete-branch: true
          title: ${{ inputs.pr_title }}
          body-path: pr-description.md
          assignees: ${{ inputs.assignee }}
