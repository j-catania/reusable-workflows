name: Reusable Dependency Update

on:
  workflow_call:
    inputs:
      assignee:
        description: "Nom d'utilisateur GitHub assigné à la PR"
        required: false
        type: string
        default: 'j-catania'
      target_branch:
        description: 'Branche temporaire créée pour la PR'
        required: false
        type: string
        default: 'automated/dependency-updates'
      node_version:
        description: 'Version de Node.js à utiliser'
        required: false
        type: string
        default: 'lts/*'
      pr_title:
        description: 'Titre de la Pull Request'
        required: false
        type: string
        default: 'chore(deps): automated dependencies update'
    secrets:
      workflow_token:
        description: 'Jeton GitHub optionnel si un PAT avec droits spécifiques est requis'
        required: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect package manager
        id: pkg_detect
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun fichier lock reconnu (pnpm-lock.yaml ou package-lock.json)." >&2
            exit 1
          fi

      - name: Install pnpm
        if: steps.pkg_detect.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pkg_detect.outputs.manager }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Initial checks (build, test, lint)
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run --if-present build
            pnpm run --if-present test
            pnpm run --if-present lint
          else
            npm run build --if-present
            npm run test --if-present
            npm run lint --if-present
          fi

      - name: Update dependencies
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm update
          else
            npm update
          fi

      - name: Post-update checks (build, test, lint)
        run: |
          if [ "${{ steps.pkg_detect.outputs.manager }}" = "pnpm" ]; then
            pnpm run --if-present build
            pnpm run --if-present test
            pnpm run --if-present lint
          else
            npm run build --if-present
            npm run test --if-present
            npm run lint --if-present
          fi

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.workflow_token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies and lockfile"
          branch: ${{ inputs.target_branch }}
          delete-branch: true
          title: ${{ inputs.pr_title }}
          body: |
            Mise à jour automatique des dépendances réalisée via workflow réutilisable.

            - Gestionnaire détecté : `${{ steps.pkg_detect.outputs.manager }}`
            - Scripts validés (`--if-present`) : `build`, `test`, `lint`.
          assignees: ${{ inputs.assignee }}
